name: Build CARAVAN Android test APK
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Check assets
        run: |
          test -s android/app/src/main/assets/game/index.html
          test -s android/app/src/main/assets/game/assets/train/locomotive.png
          test -s android/app/src/main/assets/game/app.js
      - name: Build Android debug APK
        run: gradle -p android --no-daemon :app:assembleDebug
      - name: Publish installable test APK
        uses: actions/upload-artifact@v4
        with:
          name: CARAVAN-v0.10-debug-APK
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
