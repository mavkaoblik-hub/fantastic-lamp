name: CARAVAN - Archive approved atlas previews
on:
  push:
    branches: [main]
    paths:
      - 'tools/build_caravan_art_previews.py'
      - '.github/workflows/caravan-approved-previews.yml'
      - 'game/assets/approved_style_20261023/**'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: caravan-art-preview-commit
  cancel-in-progress: false
jobs:
  render-and-archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet Pillow
      - name: Build PNG-authenticated JPEG previews (not sprites)
        run: python tools/build_caravan_art_previews.py
      - name: Preserve faithful previews in GitHub
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game/assets/catalog/previews/
          if git diff --cached --quiet; then
            echo "Preview library already current"
          else
            git commit -m "Archive actual approved Caravan atlas previews (no redesign)"
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: CARAVAN-original-art-previews
          path: game/assets/catalog/previews/
          retention-days: 30
