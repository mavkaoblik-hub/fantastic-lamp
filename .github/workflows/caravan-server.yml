name: Caravan compact server
on:
  push:
    branches: [main]
    paths: ['server/**', '.github/workflows/caravan-server.yml']
  pull_request:
    paths: ['server/**', '.github/workflows/caravan-server.yml']
permissions:
  contents: read
jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: server
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install -r server/requirements.txt httpx==0.28.1
      - run: python -m unittest server.test_caravan -v
      - run: bash -n server/install.sh
      - run: node --check server/leaderboard.js
