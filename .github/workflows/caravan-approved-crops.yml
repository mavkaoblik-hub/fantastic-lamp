name: CARAVAN - Extract approved art into reusable cards
on:
  push:
    branches: [main]
    paths:
      - 'tools/extract_caravan_approved_icons.py'
      - 'game/assets/catalog/crop_spec_v1.json'
      - '.github/workflows/caravan-approved-crops.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: caravan-approved-crops-commit
  cancel-in-progress: false
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet Pillow
      - name: Extract exact source rectangles, without artwork redesign
        run: python tools/extract_caravan_approved_icons.py
      - name: Archive original PNG crops and contact sheets in repo
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game/assets/catalog/crops_v1/ game/assets/catalog/crop_contact_sheets/
          if git diff --cached --quiet; then
            echo "Crop library unchanged"
          else
            git commit -m "Add approved-art source crops and categorized contact sheets"
            git push origin HEAD:main
          fi
      - name: Provide original-art crop library as downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: CARAVAN-Approved-Art-Crops-V1
          path: |
            game/assets/catalog/crops_v1/
            game/assets/catalog/crop_contact_sheets/
          if-no-files-found: error
          retention-days: 30
