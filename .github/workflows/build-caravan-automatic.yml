name: CARAVAN • Automatic Android APK

on:
  push:
    branches: [main]
    paths:
      - 'game/v012_restored/**'
      - 'tools/caravan_restore_v012.py'
      - 'tools/configure_caravan_sync.py'
      - 'tests/caravan_*.cjs'
      - 'android/**'
      - 'game/assets/painterly_v021/**'
      - '.github/workflows/build-caravan-automatic.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: caravan-android-auto
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout Caravan source
        uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify restored D7A source and resource sync
        run: |
          node --check game/v012_restored/app.js
          node --check game/v012_restored/server_sync.js
          node --check game/v012_restored/server_sync_ui.js
          node --test tests/*.test.cjs
      - name: Bundle approved D7A game offline with public endpoint configuration
        env:
          CARAVAN_SERVER_URL: ${{ vars.CARAVAN_SERVER_URL }}
        run: |
          python3 tools/caravan_restore_v012.py android/app/src/main/assets/game
          python3 - <<'PY'
          from pathlib import Path
          root = Path("android/app/src/main/assets/game")
          css = root / "style.css"
          css.write_text("\n".join(line for line in css.read_text().splitlines()
              if not line.lstrip().startswith('@import url(')) + "\n", encoding="utf-8")
          for name in ("app.js", "server_sync.js", "server_sync_ui.js", "sync_config.json"):
              assert (root / name).is_file(), name
          PY
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare preinstalled Android SDK
        shell: bash
        run: |
          set -euo pipefail
          test -d "$ANDROID_HOME"
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "Android SDK at $ANDROID_HOME"
      - name: Ensure Android 35 platform and build tools
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d "$ANDROID_HOME/platforms/android-35" ] || [ ! -x "$ANDROID_HOME/build-tools/35.0.0/aapt" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install 'platforms;android-35' 'build-tools;35.0.0'
          fi
          test -x "$ANDROID_HOME/build-tools/35.0.0/aapt"
      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile genuine Android APK
        run: gradle -p android --no-daemon --stacktrace :app:assemblePreview
      - name: Check APK identity, ZIP and signing
        shell: bash
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/preview/app-preview.apk
          test -s "$APK"
          unzip -tqq "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee android/apk-badging.txt
          grep -F "package: name='ua.mavka.caravan.autotest.syncpreview'" android/apk-badging.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" | tee android/apk-signature.txt
          sha256sum "$APK" | tee android/APK_SHA256.txt
      - name: Publish downloadable APK
        uses: actions/upload-artifact@v4
        with:
          name: CARAVAN-auto-install-alongside-APK
          path: |
            android/app/build/outputs/apk/preview/app-preview.apk
            android/apk-badging.txt
            android/apk-signature.txt
            android/APK_SHA256.txt
          if-no-files-found: error
          retention-days: 30
