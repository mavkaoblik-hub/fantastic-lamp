name: CARAVAN • Automatic Android APK

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'android/**'
      - 'game/v012_asset_packs/**'
      - '.github/workflows/build-caravan-automatic.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: caravan-android-auto
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout Caravan source
        uses: actions/checkout@v4
      - name: Verify full v0.12 sources and original sprite packs
        shell: bash
        run: |
          set -euo pipefail
          test -s web/index.html
          test -s web/app.js
          test -s web/style.css
          node --check web/app.js
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          meta = json.loads(Path("game/v012_asset_packs/packs_manifest.json").read_text())
          assert len(meta) == 11, f"Expected 11 art packs, got {len(meta)}"
          for part in meta:
              path = Path(part["repo_path"])
              assert path.is_file() and path.stat().st_size == part["size"], path
              assert hashlib.sha256(path.read_bytes()).hexdigest() == part["sha256"], path
          print("PASS: 11 SHA-256 checked original sprite archives")
          PY
      - name: Build complete offline game bundle
        shell: bash
        run: |
          set -euo pipefail
          GAME=android/app/src/main/assets/game
          mkdir -p "$GAME/assets"
          for part in game/v012_asset_packs/v012_part_*.zip; do
            unzip -q -o "$part" -d "$GAME"
          done
          cp web/index.html web/app.js web/style.css web/manifest.webmanifest "$GAME/"
          python3 - <<'PY'
          from pathlib import Path
          root = Path("android/app/src/main/assets/game")
          images = list((root / "assets").rglob("*.png")) + list((root / "assets").rglob("*.jpg"))
          assert len(images) == 103, f"Expected 103 game sprites, got {len(images)}"
          assert all(im.stat().st_size > 100 for im in images)
          assert (root / "assets/train/locomotive_L1.png").is_file()
          assert (root / "assets/train/locomotive_L4.png").is_file()
          assert (root / "assets/wagons/reactor.png").is_file()
          assert (root / "assets/crew/mechanic_walk_00.png").is_file()
          assert "CARAVAN_MANIFEST" in (root / "index.html").read_text()
          print("PASS: full v0.12 gameplay with 103 offline painterly assets")
          PY
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare preinstalled Android SDK
        shell: bash
        run: |
          set -euo pipefail
          test -d "$ANDROID_HOME"
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "Android SDK at $ANDROID_HOME"
      - name: Ensure Android 35 platform and build tools
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d "$ANDROID_HOME/platforms/android-35" ] || [ ! -x "$ANDROID_HOME/build-tools/35.0.0/aapt" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install 'platforms;android-35' 'build-tools;35.0.0'
          fi
          test -x "$ANDROID_HOME/build-tools/35.0.0/aapt"
      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile genuine Android APK
        run: gradle -p android --no-daemon --stacktrace :app:assembleDebug
      - name: Check APK identity, ZIP and signing
        shell: bash
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -tqq "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee android/apk-badging.txt
          grep -F "package: name='ua.mavka.caravan.autotest'" android/apk-badging.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" | tee android/apk-signature.txt
          sha256sum "$APK" | tee android/APK_SHA256.txt
      - name: Publish downloadable APK
        uses: actions/upload-artifact@v4
        with:
          name: CARAVAN-v012-Android-debug-APK
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/apk-badging.txt
            android/apk-signature.txt
            android/APK_SHA256.txt
          if-no-files-found: error
          retention-days: 30
