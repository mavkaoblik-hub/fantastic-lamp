plugins { id 'com.android.application' }

android {
    namespace 'ua.mavka.caravan'
    compileSdk 35

    defaultConfig {
        applicationId 'ua.mavka.caravan.autotest'
        minSdk 24
        targetSdk 35
        versionCode 4
        versionName '0.13-auto-account1'
        manifestPlaceholders = [appLabel: 'Караван: Автотест']
    }
    buildTypes {
        release { minifyEnabled false }
        debug { debuggable true }
        preview {
            initWith debug
            applicationIdSuffix '.syncpreview'
            versionNameSuffix '-preview'
            manifestPlaceholders = [appLabel: 'Караван: Вхід (тест)']
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint { abortOnError true }
}
