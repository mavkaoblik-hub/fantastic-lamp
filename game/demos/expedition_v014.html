<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>КАРАВАН — експедиції v0.14</title><style>*{box-sizing:border-box}body{margin:0;background:#0d171e;color:#f0e2cc;font:15px system-ui}header{padding:20px 25px;border-bottom:1px solid #584634;background:#14202a}h1{font-size:26px;letter-spacing:2px;margin:0}.wrap{max-width:1190px;margin:auto;padding:18px}button{background:#253540;color:#f0d0ac;border:1px solid #987452;border-radius:5px;margin:3px;padding:10px;font:inherit;cursor:pointer}.stage{height:min(50vw,440px);min-height:260px;overflow:hidden;position:relative;border:1px solid #9c6d46;background:linear-gradient(#263849,#6d5352 67%,#2b343c);border-radius:10px}.hills{position:absolute;inset:22% 0 18%;background:#26333b;clip-path:polygon(0 94%,12% 40%,24% 70%,35% 22%,48% 88%,62% 34%,77% 84%,89% 17%,100% 83%,100% 100%)}.ground{position:absolute;bottom:0;height:20%;width:100%;background:linear-gradient(#413c37,#1a2027);border-top:6px ridge #98704c}.stage img{position:absolute;width:31%;bottom:9%;height:75%;object-fit:contain;filter:drop-shadow(0 8px 8px #080e14)}.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin:18px 0}.tile{background:#1b2932;border:1px solid #53616b;border-radius:8px;text-align:center;padding:8px;cursor:pointer}.tile img{width:100%;aspect-ratio:3/2;object-fit:contain}.tile span{display:block;font-weight:bold;font-size:13px}small{color:#b5a18b}.status{margin:10px 0;color:#d4b08c}@media(max-width:700px){h1{font-size:19px}.tile{padding:4px}.tiles{grid-template-columns:repeat(3,1fr);gap:5px}.tile span{font-size:11px}.stage{min-height:200px}}</style></head><body><header><h1>КАРАВАН · ЕКСПЕДИЦІЇ v0.14</h1><small>12 окремих SVG у репозиторії. Зміна сцен без перезавантаження.</small></header><main class="wrap"><div><button data-set="broken_tracks,wrecked_car,collapsed_bridge">Перешкоди</button><button data-set="fuel_cache,scrap_heap,medical_cache">Знахідки</button><button data-set="water_tower,radio_mast,expedition_camp">Точки експедиції</button><button data-set="generator_station,abandoned_trolley,repair_outpost">Покинуті об'єкти</button></div><div class="stage"><div class="hills"></div><div class="ground"></div><img id="sprite0"><img id="sprite1"><img id="sprite2"></div><p class="status" id="status">Оберіть групу або окремий ресурс.</p><div class="tiles" id="tiles"></div></main><script>const ids=["broken_tracks","wrecked_car","scrap_heap","fuel_cache","medical_cache","water_tower","generator_station","radio_mast","repair_outpost","abandoned_trolley","expedition_camp","collapsed_bridge"];const names=["Завал колій","Покинута машина","Металобрухт","Запаси палива","Медичні припаси","Водонапірна башта","Пошкоджений генератор","Радіомаяк","Ремонтний пункт","Дрезина","Табір експедиції","Зруйнований міст"];const url=id=>"../assets/expedition_v014/"+id+".svg";function show(a){a.forEach((id,i)=>{const el=document.getElementById("sprite"+i);el.src=url(id);el.style.left=(1+i*34)+"%";el.alt=id});document.getElementById("status").textContent=a.map(id=>names[ids.indexOf(id)]).join(" · ")}document.querySelectorAll("[data-set]").forEach(b=>b.onclick=()=>show(b.dataset.set.split(",")));document.getElementById("tiles").innerHTML=ids.map((id,i)=>'<div class="tile" data-id="'+id+'"><img src="'+url(id)+'"><span>'+names[i]+'</span></div>').join("");document.querySelectorAll(".tile").forEach(el=>el.onclick=()=>show([el.dataset.id,el.dataset.id,el.dataset.id]));show(["broken_tracks","wrecked_car","collapsed_bridge"]);</script></body></html>
